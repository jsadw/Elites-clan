<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>★ Elites Clan ✦</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:ital,wght@0,700;0,900;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070506; --card:#0e0a0b; --line:#2a1214;
    --text:#f4ecec; --muted:#a8999b;
    --red:#e8141c; --red-soft:#ff5a5f; --gold:#ffd700;
  }
  *{box-sizing:border-box;margin:0;padding:0;scroll-behavior:smooth}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% 0%,rgba(232,20,28,.24),transparent 58%),
      var(--bg);
    color:var(--text);
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  body.locked{overflow:hidden;height:100vh}
  h1,h2,h3,.brand,.mark,.bgtext{font-family:"Orbitron",sans-serif}

  /* Shared Emblem Mark */
  .mark{
    width:68px;height:68px;margin:0 auto 20px;border-radius:16px;
    background:linear-gradient(135deg,var(--red),#990b10);display:grid;place-items:center;
    font-size:34px;font-weight:900;font-style:italic;color:#fff;
    box-shadow:0 0 36px rgba(232,20,28,.65);
    border:1px solid rgba(255,255,255,.15);
  }

  /* 1. 3-Second Loading Screen */
  #loader{
    position:fixed;inset:0;z-index:1000;display:grid;place-items:center;text-align:center;
    background:var(--bg);transition:opacity .45s ease;
  }
  #loader.done{opacity:0;pointer-events:none}
  #loader .mark{animation:pulse 1.1s ease-in-out infinite}
  #loader h1{
    font-size:28px;letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#ff5a5f,#ffd700,#fff);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 2.5s linear infinite;
  }
  #loader p{color:var(--muted);margin-top:8px;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
  .bar{width:230px;height:4px;margin:22px auto 0;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 12px var(--red);animation:fill 3s linear forwards}
  @keyframes fill{to{width:100%}}
  @keyframes pulse{50%{box-shadow:0 0 65px rgba(232,20,28,.95);transform:scale(1.05)}}
  @keyframes shine{to{background-position:200% center}}

  /* 2. Discord Hub Gateway Screen (App View) */
  #hub{
    position:fixed;inset:0;z-index:500;
    background:
      radial-gradient(ellipse at 50% 55%,rgba(232,20,28,.28),transparent 62%),
      radial-gradient(ellipse at 50% 100%,rgba(232,20,28,.16),transparent 55%),
      var(--bg);
    display:grid;place-items:center;padding:20px;
    opacity:0;visibility:hidden;transition:opacity .5s ease, visibility .5s ease;
  }
  #hub.show{opacity:1;visibility:visible}
  #hub.hide{opacity:0;visibility:hidden;pointer-events:none}

  .bgtext{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    font-size:clamp(90px,24vw,340px);font-weight:900;font-style:italic;letter-spacing:.04em;
    color:transparent;-webkit-text-stroke:2px rgba(232,20,28,.35);
    text-shadow:0 0 60px rgba(232,20,28,.28);user-select:none;
    animation:bgFloat 6s ease-in-out infinite alternate;
  }
  @keyframes bgFloat{from{transform:scale(0.98)}to{transform:scale(1.03)}}

  .hub-card{
    position:relative;width:min(450px,100%);text-align:center;
    transform:translateY(12px);transition:transform .5s ease;
  }
  #hub.show .hub-card{transform:translateY(0)}
  .hub-card h1{
    font-size:28px;font-weight:900;letter-spacing:.03em;
    background:linear-gradient(90deg,#ffffff,#ff7b7f,#ffffff);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  .hub-sub{color:var(--muted);margin:8px 0 20px;font-size:15px}

  .stats{display:flex;justify-content:center;gap:22px;margin-bottom:18px;font-size:14px;color:var(--muted)}
  .stats[hidden]{display:none}
  .stats b{color:var(--text);font-size:18px;margin-right:5px;font-family:"Orbitron",sans-serif}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ba55d;box-shadow:0 0 8px #3ba55d;margin-right:6px}

  .hub-games{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin-bottom:24px}
  .hub-games li{
    border:1px solid var(--line);background:rgba(14,10,11,.88);
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
    transition:transform .2s ease,border-color .2s ease;
  }
  .hub-games li:hover{transform:translateY(-2px);border-color:var(--red-soft)}

  .hub-btn{
    display:flex;align-items:center;justify-content:center;width:100%;
    padding:14px 18px;border-radius:12px;border:1px solid var(--red);
    font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;
    transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
  }
  .hub-btn.main{background:#f6f5ef;color:#111;border-color:#f6f5ef;box-shadow:0 4px 20px rgba(255,255,255,.15)}
  .hub-btn.main:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 26px rgba(255,255,255,.25)}
  .hub-btn.main:disabled{opacity:.75;cursor:default;transform:none}
  .hub-btn.alt{margin-top:12px;background:rgba(7,5,6,.75);color:var(--text)}
  .hub-btn.alt:hover{background:rgba(232,20,28,.22);transform:translateY(-2px)}
  .note{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.5}

  /* 3. Main Elites Clan Website */
  #site{opacity:0;transition:opacity .6s ease}
  #site.visible{opacity:1}

  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(7,5,6,.88);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:16px 6%;display:flex;justify-content:space-between;align-items:center;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:18px;color:var(--text);text-decoration:none;letter-spacing:1.5px;
  }
  .brand-badge{
    width:32px;height:32px;border-radius:8px;background:var(--red);
    display:grid;place-items:center;font-style:italic;font-size:18px;
    box-shadow:0 0 16px rgba(232,20,28,.5);
  }
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-links a, .nav-links button{
    background:none;border:none;color:var(--muted);font:inherit;
    text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;transition:color .2s;
  }
  .nav-links a:hover, .nav-links button:hover{color:var(--text)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:10px;border:1px solid var(--red);
    font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;
    transition:all .2s ease;
  }
  .btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 20px rgba(232,20,28,.35)}
  .btn.primary:hover{background:var(--red-soft);transform:translateY(-2px)}
  .btn.outline{background:rgba(14,10,11,.8);color:var(--text)}
  .btn.outline:hover{background:rgba(232,20,28,.18);transform:translateY(-2px)}

  .hero{padding:92px 6% 68px;text-align:center;max-width:860px;margin:0 auto}
  .tag{
    display:inline-block;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:rgba(232,20,28,.12);
    color:var(--red-soft);font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(2.4rem,6vw,4.2rem);font-weight:900;letter-spacing:2px;margin-bottom:16px;
    background:linear-gradient(90deg,#fff,#ff5a5f,#ffd700,#fff);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  .hero p{color:var(--muted);font-size:1.08rem;max-width:600px;margin:0 auto 28px}
  .hero-btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}

  .live-stats{
    display:inline-flex;gap:22px;margin-top:28px;padding:10px 20px;
    border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:14px;color:var(--muted);
  }
  .live-stats b{color:var(--text);margin-right:4px}

  section{padding:60px 6%;max-width:1100px;margin:0 auto}
  .sec-title{font-size:1.65rem;margin-bottom:28px;letter-spacing:1px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;
    transition:transform .22s ease, border-color .22s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--red)}
  .card h3{font-size:1.05rem;margin-bottom:8px;color:#fff}
  .card p{color:var(--muted);font-size:.94rem}

  .games{display:flex;flex-wrap:wrap;gap:12px;list-style:none}
  .games li{
    background:var(--card);border:1px solid var(--line);
    padding:12px 22px;border-radius:999px;font-weight:700;font-size:.95rem;
    transition:all .2s ease;
  }
  .games li:hover{border-color:var(--red);background:rgba(232,20,28,.12);transform:translateY(-2px)}

  .two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .req-list{list-style:none;margin:16px 0 24px;display:flex;flex-direction:column;gap:12px}
  .req-list li{color:var(--muted);padding-left:20px;position:relative}
  .req-list li::before{content:"▸";color:var(--red);position:absolute;left:0;font-weight:900}

  footer{
    border-top:1px solid var(--line);padding:38px 6%;margin-top:40px;
    display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px;
    max-width:1100px;margin-left:auto;margin-right:auto;
    color:var(--muted);font-size:14px;
  }
  .footer-btns{display:flex;gap:12px;flex-wrap:wrap}

  .reveal{opacity:0;transform:translateY(22px);transition:all .65s ease}
