
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elites Clan</title>

<style>
/* LOADING SCREEN */
body.site-loading {
    overflow: hidden;
}

#siteLoader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #070506;
    transition: opacity .4s ease, visibility .4s ease;
}

#siteLoader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-content {
    text-align: center;
}

.loader-logo {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    border-radius: 20px;
    background: #e8141c;
    color: white;
    font-size: 52px;
    font-weight: 900;
    box-shadow: 0 0 55px rgba(232,20,28,.5);
    animation: logoPulse .9s infinite alternate;
}

.loader-title {
    margin-top: 20px;
    color: white;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 5px;
}

.loader-bar {
    width: 150px;
    height: 4px;
    margin: 22px auto 0;
    background: #301014;
    border-radius: 20px;
    overflow: hidden;
}

.loader-bar::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    background: #e8141c;
    animation: loading 1.7s ease-in-out forwards;
}

@keyframes logoPulse {
    to {
        transform: scale(1.08);
        box-shadow: 0 0 80px rgba(232,20,28,.7);
    }
}

@keyframes loading {
    from { transform: translateX(-110%); }
    to { transform: translateX(280%); }
}

@media (prefers-reduced-motion: reduce) {
    .loader-logo, .loader-bar::after {
        animation: none;
    }
}
</style>
</head>

<body class="site-loading">

<!-- LOADING SCREEN -->
<div id="siteLoader">
    <div class="loader-content">
        <div class="loader-logo">E</div>
        <div class="loader-title">ELITES CLAN</div>
        <div class="loader-bar"></div>
    </div>
</div>

<!-- YOUR ORIGINAL WEBSITE CONTENT GOES HERE -->
<!-- Keep your existing website HTML in this section -->

<script>
window.addEventListener("load", function() {
    setTimeout(function() {
        const loader = document.getElementById("siteLoader");

        loader.classList.add("is-hidden");
        document.body.classList.remove("site-loading");
    }, 2000);
});
</script>

</body>
</html>
