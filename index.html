
<!-- ELITES COMMUNITY SECTION -->
<style>
.community-section {
  padding: 72px 0;
  background: #070506;
  color: #f1e9e9;
}

.community-container {
  max-width: 1000px;
  margin: auto;
  padding: 0 24px;
}

.community-tag {
  color: #ff343d;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 4px;
  margin-bottom: 12px;
}

.community-title {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 900;
  margin-bottom: 18px;
}

.community-description {
  color: #a8999b;
  max-width: 650px;
  line-height: 1.8;
  margin-bottom: 28px;
}

.community-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 275px));
  gap: 18px;
  margin-bottom: 25px;
}

.community-card {
  min-height: 195px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 22px;
  background: linear-gradient(145deg, #16090b, #0b0809);
  border: 1px solid #351216;
  border-radius: 14px;
  transition: .25s ease;
}

.community-card:hover {
  transform: translateY(-5px);
  border-color: #ed202a;
  box-shadow: 0 10px 35px #e8141c20;
}

.community-icon {
  width: 50px;
  height: 50px;
  border-radius: 13px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: #210c0f;
  border: 1px solid #42151b;
}

.community-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.community-number {
  color: white;
  font-size: 42px;
  font-weight: 900;
  line-height: 1.1;
}

.community-label {
  color: #a99a9d;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 2px;
}

.community-button {
  display: inline-block;
  padding: 16px 26px;
  background: #ed1420;
  color: white !important;
  font-weight: 800;
  border-radius: 5px;
  text-decoration: none;
  box-shadow: 0 0 25px #e8141c40;
  transition: .2s;
}

.community-button:hover {
  background: #ff3942;
  transform: translateY(-2px);
}

@media(max-width:520px) {
  .community-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .community-card {
    min-height: 165px;
    padding: 14px 8px;
  }

  .community-number {
    font-size: 34px;
  }

  .community-label {
    font-size: 9px;
  }
}
</style>

<section class="community-section" id="server">
  <div class="community-container">

    <div class="community-tag">
      INSIDE OUR DISCORD
    </div>

    <h2 class="community-title">
      THE ELITES COMMUNITY
    </h2>

    <p class="community-description">
      A growing Roblox community for gaming, events,
      and meeting new people. Here's a quick look at
      our server stats.
    </p>

    <div class="community-stats">

      <!-- MEMBERS CARD -->
      <div class="community-card">
        <div class="community-icon">
          <img id="communityLogo" alt="Elites Clan Logo">
        </div>

        <div class="community-number">54</div>

        <div class="community-label">
          SERVER MEMBERS
        </div>
      </div>

      <!-- BOTS CARD -->
      <div class="community-card">
        <div class="community-icon"
             style="font-size:27px;">
          🤖
        </div>

        <div class="community-number">20</div>

        <div class="community-label">
          BOTS
        </div>
      </div>

    </div>

    <a class="community-button"
       href="https://discord.gg/YYP9S6BEV"
       target="_blank"
       rel="noopener noreferrer">
      Join the Elites Discord ↗
    </a>

  </div>
</section>

<script>
  // Reuse your existing website logo.
  const existingLogo = document.querySelector(".brand img");

  if (existingLogo) {
    document.getElementById("communityLogo").src =
      existingLogo.src;
  }
</script>
