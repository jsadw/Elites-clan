<style>
img.crown{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;
  filter:drop-shadow(0 0 12px rgba(255,40,60,.55)) drop-shadow(0 0 2px rgba(255,120,130,.35));
  user-select:none;-webkit-user-drag:none;pointer-events:none}

/* header + footer badge */
.brand-mark{position:relative;width:52px!important;height:52px!important;border:0!important;border-radius:50%!important;
  background:none!important;box-shadow:none!important;overflow:visible!important}
.brand-mark::before{content:"";position:absolute;inset:-9px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,35,60,.5),rgba(255,35,60,0) 68%);
  filter:blur(5px);opacity:.75;transition:opacity .3s ease,transform .4s var(--ease)}
.brand:hover .brand-mark::before{opacity:1;transform:scale(1.2)}
.brand:hover .brand-mark{transform:scale(1.08) rotate(-4deg)!important}

/* loading screen */
.loader-mark{width:140px!important;height:140px!important;border:0!important;background:none!important;
  box-shadow:none!important;animation:crown-float 3.2s ease-in-out infinite!important}
.loader-mark::before{inset:-16px!important;border:1px dashed rgba(255,70,90,.35)!important}
.loader-mark::after{inset:-8px!important;border:2px solid transparent!important;
  border-top-color:#ff3b4e!important;border-right-color:rgba(255,214,10,.55)!important}
.loader-mark img.crown{filter:drop-shadow(0 0 28px rgba(255,30,55,.8)) drop-shadow(0 0 4px rgba(255,150,160,.5))}
.page-loader{background:radial-gradient(ellipse 55% 45% at 50% 42%,rgba(255,30,60,.14),transparent 70%),#050506!important}
.loader-bar span{background:linear-gradient(90deg,transparent,#ff3b4e,#ffd60a,transparent)!important;box-shadow:0 0 16px #ff3b4e!important}
@keyframes crown-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}

/* hero status-card emblem (ring spins, crown stays upright) */
.emblem-ring{width:128px!important;height:128px!important;animation:none!important;
  background:conic-gradient(from 0deg,transparent 0 55%,#ff3b4e 70%,#ffd60a 84%,transparent 100%)!important}
.emblem-ring::before{background:#07070a!important;border-color:rgba(255,60,80,.28)!important}
.emblem-ring::after{border-color:rgba(255,70,90,.25)!important;animation:spin-slow 14s linear infinite}
.emblem-core{width:104px!important;height:104px!important;background:none!important;
  box-shadow:0 0 50px -6px rgba(255,30,55,.7)!important;animation:crown-float 4s ease-in-out infinite}
@media(max-width:560px){
  .brand-mark{width:44px!important;height:44px!important}
  .emblem-ring{width:104px!important;height:104px!important}
  .emblem-core{width:84px!important;height:84px!important}
  .loader-mark{width:116px!important;height:116px!important}}

/* blend the page glow with the crown */
.bg-glow--one{background:rgba(220,20,45,.16)!important}
.bg-glow--two{background:rgba(255,120,0,.08)!important}
.hero-spotlight{background:radial-gradient(ellipse at center,rgba(255,40,60,.11),rgba(255,214,10,.05) 45%,transparent 66%)!important}
@media (prefers-reduced-motion:reduce){.loader-mark,.emblem-core{animation:none!important}}
</style>
