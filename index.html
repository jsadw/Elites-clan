
<style>
html, body {
  margin: 0 !important;
  background: #070506 !important;
}

.community-section,
.community-section * {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif !important;
}

.community-section {
  width: 100%;
  padding: 72px 24px;
  background: #070506;
  color: #f5eeee;
}

.community-container {
  max-width: 1000px;
  margin: auto;
}

.community-tag {
  color: #ff343d;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 4px;
  margin-bottom: 18px;
}

.community-title {
  color: #f5eeee;
  font-size: clamp(30px, 5vw, 42px);
  font-weight: 850;
  margin: 0 0 20px;
  line-height: 1.2;
}

.community-description {
  color: #b6a9ac;
  font-size: 16px;
  line-height: 1.8;
  max-width: 650px;
  margin: 0 0 30px;
}

.community-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 275px));
  gap: 18px;
  margin-bottom: 20px;
}

.community-card {
  min-height: 195px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 22px;
  background: linear-gradient(145deg, #16090b, #0b0809);
  border: 1px solid #351216;
  border-radius: 14px;
  transition: .25s ease;
}

.community-card:hover {
  transform: translateY(-5px);
  border-color: #ed202a;
  box-shadow: 0 10px 35px #e8141c20;
}

.community-icon {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  overflow: hidden;
  background: #090609;
  border: 1px solid #42151b;
  display: flex;
  align-items: center;
  justify-content: center;
}

.community-icon img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.community-bot {
  font-size: 27px;
}

.community-number {
  color: #fff;
  font-size: 42px;
  font-weight: 900;
  line-height: 1.1;
}

.community-label {
  color: #a99a9d;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 2px;
}

.community-button {
  display: inline-block;
  padding: 17px 27px;
  background: #ed1420;
  color: #fff !important;
  font-size: 15px;
  font-weight: 800;
  border-radius: 5px;
  text-decoration: none !important;
  box-shadow: 0 0 25px #e8141c40;
  transition: .2s ease;
}

.community-button:hover {
  background: #ff3942;
  transform: translateY(-3px);
}

@media(max-width:520px) {
  .community-section {
    padding: 50px 18px;
  }

  .community-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .community-card {
    min-height: 165px;
    padding: 12px 5px;
  }

  .community-number {
    font-size: 34px;
  }

  .community-label {
    font-size: 9px;
    letter-spacing: 1px;
  }
}
</style>

<section class="community-section" id="server">
  <div class="community-container">

    <div class="community-tag">
      INSIDE OUR DISCORD
    </div>

    <h2 class="community-title">
      THE ELITES COMMUNITY
    </h2>

    <p class="community-description">
      A growing Roblox community for gaming, events,
      and meeting new people. Here's a quick look at
      our server stats.
    </p>

    <div class="community-stats">

      <!-- ELITES MEMBERS -->
      <div class="community-card">

        <div class="community-icon">
          <img
            alt="Elites Clan Logo"
            src="data:image/png;base64,BASE64_LOGO_REPLACE">
        </div>

        <div class="community-number">54</div>

        <div class="community-label">
          SERVER MEMBERS
        </div>

      </div>

      <!-- BOTS -->
      <div class="community-card">

        <div class="community-icon community-bot">
          🤖
        </div>

        <div class="community-number">20</div>

        <div class="community-label">
          BOTS
        </div>

      </div>

    </div>

    <a
      class="community-button"
      href="https://discord.gg/YYP9S6BEV"
      target="_blank"
      rel="noopener noreferrer">
      Join the Elites Discord ↗
    </a>

  </div>
</section>
